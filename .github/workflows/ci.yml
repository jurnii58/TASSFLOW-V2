name: TASSFLOW v2.0 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Verificación Automatizada (Flask + ML + NOM-035 + Docker)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Instalar dependencias del proyecto y herramientas QA
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: 4. Auditoría estática de sintaxis Python (Flake8)
        run: |
          flake8 tassflow_app run.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. Ejecutar Suite de Pruebas Unitarias e Integración (Pytest)
        env:
          SECRET_KEY: ci-test-secret-key-nom035
          MONGO_URI: mongodb://localhost:27017/carga_mental_ci_test
        run: |
          pytest tests/test_ci_suite.py -v

      - name: 6. Validar configuración de Docker Compose
        run: |
          docker compose config -q
