# TASSFLOW v2.0 - Configuración Local de Mosquitto para Windows
# Ingesta de Telemetría Biométrica a 1 Hz bajo QoS 0

# Listener estándar TCP en puerto 1883 para todas las interfaces
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Límites optimizados para streaming en tiempo real
max_queued_messages 1000
max_inflight_messages 40
