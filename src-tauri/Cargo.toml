[package]
name = "tassflow"
version = "2.0.0"
description = "TASSFLOW v2.0 - Radar Biometrico"
authors = ["TASSFLOW Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["notification-all", "shell-open", "window-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
