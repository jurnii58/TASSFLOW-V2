# Configuración Oficial Eclipse Mosquitto 2.0 - TASSFLOW v2.0
# Optimizada para Telemetría Biométrica a 1 Hz y QoS 0 (Sin colisiones Wi-Fi 2.4/5 GHz)

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Listener estándar TCP MQTT (Puerto 1883)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Listener WebSockets MQTT (Puerto 9001)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Límites de cola optimizados para streaming en tiempo real QoS 0
max_queued_messages 1000
max_inflight_messages 40
